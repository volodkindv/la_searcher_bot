# CI-only overrides: speed up the test Postgres.
# For a throwaway test DB, durability is irrelevant, so we disable fsync
# and friends. This makes `make ci-test` finish well inside the 2-minute
# GitHub Actions timeout (see .github/workflows/test.yml).
# Used by: make ci-test  (docker compose -f docker-compose.yml -f docker-compose.ci.yml ...)
services:
  postgres:
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
